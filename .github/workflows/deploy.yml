name: Deploy para EC2

# Desativado: a instância EC2 de destino foi encerrada em novembro de 2026.
# O workflow roda apenas manualmente e foi mantido como referência.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 52.67.253.167
          username: ec2-user
          key: ${{ secrets.chave_flask }}
          script: |
            cd /home/ec2-user/loja-flask-api
            git pull
            venv/bin/pip install -r requirements.txt
            sudo systemctl restart loja-flask